# Host-only preview of the small-panel UI (ui/mini/app.slint): renders the
# menu and play screens for the 320x170 bar and the 240x240 round board with
# the device's renderer and fonts, and writes PNGs.
[package]
name = "piano-mini-ui-preview"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
png = "0.17"

[build-dependencies]
slint-build = { version = "=1.18.1", features = ["sdf-fonts"] }
